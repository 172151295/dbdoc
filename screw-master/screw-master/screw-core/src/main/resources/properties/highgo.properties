# 瀚高(HighGo)数据库连接配置
# 官方驱动：com.highgo.jdbc.Driver（禁用 PostgreSQL 驱动混用）
# 说明：瀚高数据库兼容 PostgreSQL 协议生态，端口默认 5866
driverClass=com.highgo.jdbc.Driver
# JDBC URL 格式：jdbc:highgo://host:port/database?currentSchema=schema
jdbcUrl=jdbc:highgo://127.0.0.1:5866/testdb?currentSchema=public
# 用户名
username=username
# 密码
password=password
