server:
  port: 8760
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: screw-web
  # H2 文件型数据库：数据保存在 data/screwweb.mv.db，重启不丢失
  datasource:
    url: jdbc:h2:file:./data/screwweb;MODE=MySQL;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

# 连接密码加密密钥（生产环境请通过环境变量覆盖）
screw:
  security:
    aes-key: ${SCREW_AES_KEY:9f5c3a1e7b2d4f6a8c0e1b3d5f7a9c2e}
    # 与 jimuqu-admin-ui .env 的 VITE_GLOB_RSA_* 配对的请求加解密 RSA 对
    # rsa-private-key: 后端解密请求 encrypt-key 头(PKCS1v1.5) 用
    # rsa-public-key:  后端若加密响应时用公钥(本项目默认不加密响应 前端仅在有 encrypt-key 头时才解密)
    rsa-private-key: ${SCREW_RSA_PRIVATE_KEY:}
    rsa-public-key: ${SCREW_RSA_PUBLIC_KEY:}

logging:
  level:
    cn.smallbun.screw: info
